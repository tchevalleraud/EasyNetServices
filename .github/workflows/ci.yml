name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The web interface is embedded at build time; a placeholder is enough for tests.
      - name: Create web placeholder
        run: mkdir -p web/dist && touch web/dist/.keep
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee test.log
      - name: Report test failures
        if: failure()
        run: |
          # Surface the failing tests as annotations, visible without opening the logs.
          grep -E -- '--- FAIL|_test\.go:[0-9]+|^FAIL|panic:' test.log | head -30 | while IFS= read -r line; do
            echo "::error title=go test::${line}"
          done

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker image
    needs: [backend, frontend]
    uses: ./.github/workflows/docker.yml
    with:
      channel: dev
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    secrets: inherit
