name: Docker

# Reusable workflow building the multi-architecture image and optionally
# publishing it to Docker Hub.
on:
  workflow_call:
    inputs:
      channel:
        description: "dev or release"
        type: string
        required: true
      version:
        description: "Release version without the v prefix (release channel only)"
        type: string
        default: ""
      push:
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: docker.io/tchevalleraud91/easynetservices

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: inputs.push
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=dev,enable=${{ inputs.channel == 'dev' }}
            type=sha,prefix=dev-,enable=${{ inputs.channel == 'dev' }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.channel == 'release' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.channel == 'release' }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ inputs.channel == 'release' }}
            type=raw,value=latest,enable=${{ inputs.channel == 'release' }}
          labels: |
            org.opencontainers.image.title=EasyNetServices
            org.opencontainers.image.description=DNS, DHCP and NTP services managed through a web interface
            org.opencontainers.image.licenses=Apache-2.0

      - name: Compute build version
        id: version
        run: |
          if [ "${{ inputs.channel }}" = "release" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.version.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
