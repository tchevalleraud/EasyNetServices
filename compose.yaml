# Example deployment. DHCP needs direct access to the network, hence the host
# network mode. To serve DNS on every address, free port 53 on the host first
# (see "DNS and port 53 on the host" in the README).
services:
  easynetservices:
    image: tchevalleraud91/easynetservices:latest
    container_name: easynetservices
    network_mode: host
    restart: unless-stopped
    environment:
      ENS_ROLE: standalone
      ENS_LISTEN: ":8443"
      # Uncomment both settings to let the NTP server synchronize the host clock.
      # ENS_NTP_CLOCK_CONTROL: "true"
    # cap_add: [SYS_TIME]
    volumes:
      - easynetservices-data:/data

volumes:
  easynetservices-data:
