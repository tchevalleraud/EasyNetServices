openapi: 3.1.0
info:
  title: EasyNetServices API
  version: v1
  description: |
    REST API of EasyNetServices. The web interface uses this API exclusively.

    Authentication uses a session cookie obtained from `POST /auth/login`.
    Until the password of the account has been changed, only the endpoints of
    the `auth` group are accessible; other endpoints return `403` with the
    `password_change_required` error code.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /api/v1
security:
  - session: []

tags:
  - name: auth
  - name: system
  - name: ntp
  - name: dns
  - name: dhcp

paths:
  /version:
    get:
      tags: [system]
      summary: Get build information
      security: []
      responses:
        "200":
          description: Build information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }

  /auth/login:
    post:
      tags: [auth]
      summary: Open a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Session opened; the `ens_session` cookie is set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      tags: [auth]
      summary: Close the current session
      responses:
        "204": { description: Session closed }
        "401": { $ref: "#/components/responses/Error" }

  /auth/me:
    get:
      tags: [auth]
      summary: Get the authenticated user
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }

  /auth/password:
    post:
      tags: [auth]
      summary: Change the password of the authenticated user
      description: All other sessions of the user are closed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 8, maxLength: 256 }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /system:
    get:
      tags: [system]
      summary: Get system information
      responses:
        "200":
          description: System information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/System" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /system/settings:
    get:
      tags: [system]
      summary: Get the system settings
      responses:
        "200":
          description: System settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemSettings" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      tags: [system]
      summary: Replace the system settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SystemSettings" }
      responses:
        "200":
          description: Settings applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemSettings" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /system/time:
    get:
      tags: [system]
      summary: Get the current server time
      responses:
        "200":
          description: Server time in the configured time zone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemTime" }
        "401": { $ref: "#/components/responses/Error" }

  /dns/settings:
    get:
      tags: [dns]
      summary: Get the resolver settings
      responses:
        "200":
          description: Resolver settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DnsSettings" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      tags: [dns]
      summary: Replace and apply the resolver settings
      description: |
        When the resolver is enabled while stopped, port 53 is checked on the
        listen addresses first; a busy port is reported as a validation error.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DnsSettings" }
      responses:
        "200":
          description: Settings applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DnsSettings" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /dns/status:
    get:
      tags: [dns]
      summary: Get the runtime state of the DNS services
      responses:
        "200":
          description: DNS status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DnsStatus" }
        "401": { $ref: "#/components/responses/Error" }

  /dns/zones:
    get:
      tags: [dns]
      summary: List the local zones
      responses:
        "200":
          description: Local zones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DnsZone" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      tags: [dns]
      summary: Create a local zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: home.lan }
                nameservers:
                  type: array
                  items: { type: string, example: ns1.home.lan }
      responses:
        "201":
          description: Zone created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DnsZoneDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /dns/zones/{zone}:
    parameters:
      - { name: zone, in: path, required: true, schema: { type: string }, example: home.lan }
    get:
      tags: [dns]
      summary: Get a local zone with its records
      responses:
        "200":
          description: Zone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DnsZoneDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [dns]
      summary: Delete a local zone and its records
      responses:
        "204": { description: Zone deleted }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /dns/zones/{zone}/rrsets:
    parameters:
      - { name: zone, in: path, required: true, schema: { type: string } }
    put:
      tags: [dns]
      summary: Create or replace a record set
      description: |
        Host names without a dot (and "@") in CNAME, NS, MX and SRV values are
        relative to the zone; TXT values are quoted automatically. SOA records
        are maintained automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DnsRRSet" }
      responses:
        "200":
          description: Record set saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DnsRRSet" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /dns/zones/{zone}/rrsets/{name}/{type}:
    parameters:
      - { name: zone, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string }, example: nas.home.lan }
      - { name: type, in: path, required: true, schema: { type: string }, example: A }
    delete:
      tags: [dns]
      summary: Delete a record set
      responses:
        "204": { description: Record set deleted }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /dhcp/settings:
    get:
      tags: [dhcp]
      summary: Get the global DHCP settings
      responses:
        "200":
          description: DHCP settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DhcpSettings" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      tags: [dhcp]
      summary: Replace and apply the global DHCP settings
      description: |
        The configuration is checked by Kea before it is stored; a refusal is
        returned as a `config_rejected` error. An interface used by a subnet
        cannot be removed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DhcpSettings" }
      responses:
        "200":
          description: Settings applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DhcpSettings" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /dhcp/status:
    get:
      tags: [dhcp]
      summary: Get the runtime state of the DHCP servers
      responses:
        "200":
          description: DHCP status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DhcpStatus" }
        "401": { $ref: "#/components/responses/Error" }

  /dhcp/interfaces:
    get:
      tags: [dhcp]
      summary: List the network interfaces of the host
      responses:
        "200":
          description: Interfaces, without the loopback
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NetInterface" }
        "401": { $ref: "#/components/responses/Error" }

  /dhcp/{family}/subnets:
    parameters:
      - $ref: "#/components/parameters/DhcpFamily"
    get:
      tags: [dhcp]
      summary: List the subnets of a family
      responses:
        "200":
          description: Subnets, by ID
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DhcpSubnet" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [dhcp]
      summary: Create a subnet
      description: The ID is assigned by the server and the subnet must not overlap another one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DhcpSubnet" }
      responses:
        "201":
          description: Subnet created and applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DhcpSubnet" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /dhcp/{family}/subnets/{id}:
    parameters:
      - $ref: "#/components/parameters/DhcpFamily"
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [dhcp]
      summary: Get a subnet with its reservations
      responses:
        "200":
          description: Subnet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DhcpSubnet" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [dhcp]
      summary: Replace and apply a subnet, including its reservations
      description: The ID of the subnet never changes. A running server reloads without losing its leases.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DhcpSubnet" }
      responses:
        "200":
          description: Subnet saved and applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DhcpSubnet" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      tags: [dhcp]
      summary: Delete a subnet and its reservations
      responses:
        "204": { description: Subnet deleted }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /dhcp/{family}/leases:
    parameters:
      - $ref: "#/components/parameters/DhcpFamily"
    get:
      tags: [dhcp]
      summary: List the leases of a family
      parameters:
        - { name: subnet, in: query, schema: { type: integer }, description: Only the leases of this subnet ID }
      responses:
        "200":
          description: Leases, by address
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DhcpLease" }
        "401": { $ref: "#/components/responses/Error" }
        "503":
          description: The server of the family is not running (`dhcp_unavailable`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /dhcp/{family}/leases/{address}:
    parameters:
      - $ref: "#/components/parameters/DhcpFamily"
      - { name: address, in: path, required: true, schema: { type: string }, example: 192.168.1.120 }
    delete:
      tags: [dhcp]
      summary: Delete a lease so that its address can be assigned again
      responses:
        "204": { description: Lease deleted }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /ntp/config:
    get:
      tags: [ntp]
      summary: Get the NTP configuration
      responses:
        "200":
          description: NTP configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NtpConfig" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      tags: [ntp]
      summary: Replace and apply the NTP configuration
      description: |
        The whole configuration is replaced. Networks are normalized (host bits
        cleared). The NTP daemon is restarted when the configuration changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NtpConfig" }
      responses:
        "200":
          description: Configuration applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NtpConfig" }
        "400":
          description: Invalid configuration (`validation_failed` with field details, or `config_rejected` by chrony)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500":
          description: Configuration saved but not applied (`apply_failed`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ntp/status:
    get:
      tags: [ntp]
      summary: Get the runtime state of the NTP server
      responses:
        "200":
          description: NTP status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NtpStatus" }
        "401": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: ens_session

  parameters:
    DhcpFamily:
      name: family
      in: path
      required: true
      description: "`v4` for DHCPv4, `v6` for DHCPv6"
      schema: { type: string, enum: [v4, v6] }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: invalid_credentials }
            message: { type: string }
            details:
              type: array
              description: Invalid fields, for `validation_failed` errors.
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string, example: "sources[0].address" }
                  message: { type: string }

    Version:
      type: object
      required: [version, commit, date]
      properties:
        version: { type: string, example: 0.1.0 }
        commit: { type: string }
        date: { type: string }

    User:
      type: object
      required: [username, source, mustChangePassword]
      properties:
        username: { type: string, example: admin }
        source: { type: string, example: local }
        mustChangePassword: { type: boolean }

    System:
      type: object
      required: [version, role, hostname, uptimeSeconds]
      properties:
        version: { type: string }
        role: { type: string, enum: [standalone, controller, node] }
        hostname: { type: string }
        uptimeSeconds: { type: integer }

    NtpConfig:
      type: object
      required: [enabled, sources, access, localStratum]
      properties:
        enabled: { type: boolean }
        sources:
          type: array
          maxItems: 32
          items:
            type: object
            required: [type, address, iburst, prefer, nts]
            properties:
              type: { type: string, enum: [server, pool] }
              address: { type: string, description: Hostname or IP address, example: pool.ntp.org }
              iburst: { type: boolean, description: Faster initial synchronization }
              prefer: { type: boolean, description: Prefer this source over the others }
              nts: { type: boolean, description: Authenticate with Network Time Security }
        access:
          type: array
          maxItems: 256
          description: Client networks allowed or denied; clients matching no rule are denied.
          items:
            type: object
            required: [action, network]
            properties:
              action: { type: string, enum: [allow, deny] }
              network: { type: string, example: 192.168.1.0/24 }
        localStratum:
          type: integer
          minimum: 0
          maximum: 15
          description: Stratum served from the local clock when no source is reachable; 0 disables it.

    NtpStatus:
      type: object
      required: [state, synchronized, tracking, sources]
      properties:
        state: { type: string, enum: [running, stopped, disabled, unavailable] }
        synchronized: { type: boolean }
        tracking:
          oneOf:
            - type: "null"
            - type: object
              properties:
                referenceId: { type: string }
                reference: { type: string }
                stratum: { type: integer }
                offsetSeconds: { type: number }
                rootDelaySeconds: { type: number }
                rootDispersionSeconds: { type: number }
                updateIntervalSeconds: { type: number }
                leapStatus: { type: string }
        sources:
          type: array
          items:
            type: object
            properties:
              mode: { type: string, enum: [server, peer, refclock, unknown] }
              state:
                type: string
                enum: [selected, combined, not-combined, unreachable, falseticker, too-variable, unknown]
              address: { type: string }
              stratum: { type: integer }
              pollSeconds: { type: integer }
              reach: { type: string, description: Reachability register in octal }
              lastRxSeconds: { type: integer, description: "-1 when no sample was received" }
              offsetSeconds: { type: number }
              errorSeconds: { type: number }

    SystemSettings:
      type: object
      required: [timezone]
      properties:
        timezone:
          type: string
          description: IANA time zone used to display dates and in the logs.
          example: Europe/Paris

    SystemTime:
      type: object
      required: [unixMillis, timezone, abbreviation, utcOffsetSeconds, formattedLocal, formattedUtc]
      properties:
        unixMillis: { type: integer, format: int64 }
        timezone: { type: string, example: Europe/Paris }
        abbreviation: { type: string, example: CEST }
        utcOffsetSeconds: { type: integer, example: 7200 }
        formattedLocal: { type: string, format: date-time }
        formattedUtc: { type: string, format: date-time }

    DnsSettings:
      type: object
      required: [enabled, listenAddresses, allowFrom, resolution, forwarders, forwardZones, dnssec]
      properties:
        enabled: { type: boolean }
        listenAddresses:
          type: array
          description: IP addresses to listen on; empty means all.
          items: { type: string, example: 192.168.1.2 }
        allowFrom:
          type: array
          description: Client networks or addresses allowed to query the resolver.
          items: { type: string, example: 192.168.1.0/24 }
        resolution: { type: string, enum: [recursive, forward] }
        forwarders:
          type: array
          items:
            type: object
            required: [address, tls]
            properties:
              address: { type: string, example: 9.9.9.9 }
              tls: { type: boolean, description: DNS over TLS on port 853 }
        forwardZones:
          type: array
          items:
            type: object
            required: [name, servers, recursive]
            properties:
              name: { type: string, example: corp.example.com }
              servers:
                type: array
                items: { type: string, example: "10.0.0.10:53" }
              recursive: { type: boolean, description: The servers are resolvers rather than authoritative servers }
        dnssec: { type: string, enum: [off, process, validate] }

    DnsStatus:
      type: object
      required: [authoritative, recursor, stats]
      properties:
        authoritative: { type: string, enum: [running, stopped, disabled, unavailable] }
        recursor: { type: string, enum: [running, stopped, disabled, unavailable] }
        stats:
          oneOf:
            - type: "null"
            - type: object
              properties:
                questions: { type: integer }
                cacheHits: { type: integer }
                cacheMisses: { type: integer }
                cacheEntries: { type: integer }
                noErrorAnswers: { type: integer }
                nxdomainAnswers: { type: integer }
                servfailAnswers: { type: integer }
                uptimeSeconds: { type: integer }

    DnsZone:
      type: object
      required: [name, kind, serial]
      properties:
        name: { type: string, example: home.lan }
        kind: { type: string, example: Native }
        serial: { type: integer }

    DnsZoneDetail:
      allOf:
        - $ref: "#/components/schemas/DnsZone"
        - type: object
          required: [rrsets]
          properties:
            rrsets:
              type: array
              items: { $ref: "#/components/schemas/DnsRRSet" }

    DnsRRSet:
      type: object
      required: [name, type, ttl, records]
      properties:
        name: { type: string, example: nas.home.lan }
        type: { type: string, enum: [A, AAAA, CAA, CNAME, MX, NS, PTR, SRV, TXT, SOA] }
        ttl: { type: integer, minimum: 1, example: 3600 }
        records:
          type: array
          items:
            type: object
            required: [content]
            properties:
              content: { type: string, example: 192.168.1.10 }
              disabled: { type: boolean }

    DhcpOptions:
      type: object
      description: Options sent to the clients. In a subnet, empty options inherit the global ones.
      properties:
        dnsServers:
          type: array
          items: { type: string, example: 192.168.1.2 }
        domainName: { type: string, description: DHCPv4 only, example: home.lan }
        domainSearch:
          type: array
          items: { type: string, example: home.lan }
        ntpServers:
          type: array
          description: NTP servers in DHCPv4, SNTP servers in DHCPv6.
          items: { type: string, example: 192.168.1.2 }

    DhcpFamilySettings:
      type: object
      required: [enabled, validLifetime, preferredLifetime, options]
      properties:
        enabled: { type: boolean }
        validLifetime: { type: integer, minimum: 60, description: Lease time in seconds, example: 86400 }
        preferredLifetime: { type: integer, description: DHCPv6 preferred lifetime in seconds; 0 in DHCPv4, example: 43200 }
        options: { $ref: "#/components/schemas/DhcpOptions" }

    DhcpSettings:
      type: object
      required: [interfaces, dhcpv4, dhcpv6]
      properties:
        interfaces:
          type: array
          description: Network interfaces the servers listen on.
          items: { type: string, example: eth0 }
        dhcpv4: { $ref: "#/components/schemas/DhcpFamilySettings" }
        dhcpv6: { $ref: "#/components/schemas/DhcpFamilySettings" }

    DhcpReservation:
      type: object
      required: [ipAddress]
      properties:
        hwAddress: { type: string, example: "00:11:22:33:44:55" }
        duid: { type: string, description: DHCPv6 only; set either it or hwAddress, example: "00:01:00:01:2c:5f:3c:29:00:11:22:33:44:55" }
        ipAddress: { type: string, example: 192.168.1.10 }
        hostname: { type: string, example: nas }
        description: { type: string }

    DhcpSubnet:
      type: object
      required: [subnet]
      properties:
        id: { type: integer, readOnly: true, example: 1 }
        subnet: { type: string, example: 192.168.1.0/24 }
        description: { type: string }
        interface:
          type: string
          description: Interface of the directly connected clients; required in DHCPv6 unless the clients are behind a relay.
          example: eth0
        pools:
          type: array
          items: { type: string, example: 192.168.1.100 - 192.168.1.199 }
        gateway: { type: string, description: DHCPv4 only, example: 192.168.1.1 }
        validLifetime: { type: integer, description: Lease time in seconds; 0 inherits the global one }
        options: { $ref: "#/components/schemas/DhcpOptions" }
        reservations:
          type: array
          items: { $ref: "#/components/schemas/DhcpReservation" }

    DhcpLease:
      type: object
      properties:
        address: { type: string, example: 192.168.1.120 }
        hwAddress: { type: string }
        duid: { type: string }
        hostname: { type: string }
        subnetId: { type: integer }
        state: { type: string, enum: [active, declined, expired, released, registered, unknown] }
        expires: { type: string, format: date-time }
        reserved: { type: boolean, description: The address matches a reservation of the client }

    DhcpFamilyStatus:
      type: object
      properties:
        state: { type: string, enum: [running, stopped, disabled, unavailable] }
        socketErrors:
          type: array
          description: Why the server cannot listen on an interface.
          items: { type: string }
        subnets:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              subnet: { type: string }
              total: { type: number, description: Size of the pools, which can exceed 64-bit integers in IPv6 }
              assigned: { type: number }
              declined: { type: number }
        packetsReceived: { type: number }
        packetsSent: { type: number }

    DhcpStatus:
      type: object
      properties:
        dhcpv4: { $ref: "#/components/schemas/DhcpFamilyStatus" }
        dhcpv6: { $ref: "#/components/schemas/DhcpFamilyStatus" }

    NetInterface:
      type: object
      properties:
        name: { type: string, example: eth0 }
        hwAddress: { type: string }
        up: { type: boolean }
        addresses:
          type: array
          items: { type: string, example: 192.168.1.2/24 }
